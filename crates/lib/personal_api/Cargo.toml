[package]
name = "personal_api"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "fs", "sync", "net", "io-util"] }
base64.workspace = true
chrono.workspace = true
uuid = { version = "1.22.0", features = ["v4"] }
url.workspace = true
log.workspace = true
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
tempfile.workspace = true
