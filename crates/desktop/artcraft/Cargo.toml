[package]
name = "artcraft"
version = "0.42.1"
description = "Artcraft"
authors = ["you"]
license = "MIT OR Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"
publish = false

# [lints.rust]
# unused_imports = "forbid"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "artcraft_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[features]
default = ["personal-api"]
personal-api = ["dep:personal_api"]
original-cloud = ["dep:image", "dep:toml", "dep:browser_emulation", "dep:cookie_store_wrapper", "dep:artcraft_api_defs", "dep:artcraft_client", "dep:artcraft_router", "dep:build_metadata", "dep:cookie_store", "dep:enums", "dep:errors", "dep:fal_client", "dep:filesys", "dep:grok_consumer_client", "dep:uuid_utils", "dep:images", "dep:memory_store", "dep:midjourney_client", "dep:mimetypes", "dep:openai_sora_client", "dep:primitives", "dep:sqlite_tasks", "dep:tokens", "dep:url_utils", "dep:web_base64", "dep:worldlabs_consumer_client", "dep:anyhow", "dep:bytes", "dep:chrono", "dep:directories", "dep:discord-rich-presence", "dep:futures", "dep:indexmap", "dep:once_cell", "dep:os_info", "dep:rand", "dep:tempdir", "dep:tempfile", "dep:tokio-util"]

[dependencies]
personal_api = { path = "../../lib/personal_api", optional = true }

toml = { workspace = true, optional = true }
browser_emulation = { workspace = true, optional = true }
cookie_store_wrapper = { workspace = true, features = ["wreq"], optional = true }

# Internal
artcraft_api_defs = { workspace = true, optional = true }
artcraft_client = { workspace = true, optional = true }
artcraft_router = { workspace = true, optional = true }
build_metadata = { workspace = true, optional = true }
cookie_store = { workspace = true, optional = true }
enums = { workspace = true, optional = true }
errors = { workspace = true, optional = true }
fal_client = { workspace = true, optional = true }
filesys = { workspace = true, optional = true }
grok_consumer_client = { workspace = true, optional = true }
uuid_utils = { workspace = true, optional = true }
images = { workspace = true, optional = true }
memory_store = { workspace = true, optional = true }
midjourney_client = { workspace = true, optional = true }
mimetypes = { workspace = true, optional = true }
openai_sora_client = { workspace = true, optional = true }
primitives = { workspace = true, optional = true }
sqlite_tasks = { workspace = true, optional = true }
tokens = { workspace = true, optional = true }
url_utils = { workspace = true, optional = true }
web_base64 = { workspace = true, optional = true }
worldlabs_consumer_client = { workspace = true, optional = true }

# External
anyhow = { workspace = true, optional = true }
base64.workspace = true
bytes = { version = "1.10.1", optional = true }
chrono = { workspace = true, optional = true }
directories = { version = "6.0.0", optional = true }
dirs = "6.0.0"
discord-rich-presence = { version = "1.1.0", optional = true }
futures = { version = "0.3", optional = true }
image = { version = "0.25.5", optional = true }
indexmap = { workspace = true, optional = true }
log.workspace = true
once_cell = { workspace = true, optional = true }
os_info = { version = "3.12.0", default-features = false, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["multipart", "stream"], default-features = false } # NB(bt,2025-03-10): default-features = false on Windows while I debug openssl / rustls
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-upload.workspace = true
tauri.workspace = true
tempdir = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "fs"] }
tokio-util = { workspace = true, optional = true }
url.workspace = true

# NB: We need to vendor this in so that we can access the cookies inside via the private API
tauri-plugin-http = { path = "../../vendor/tauri-plugin-http" }
tauri-plugin-opener = "2"

# # Transparent title bar on MacOS
# # NB: See the notes here:
# # https://v2.tauri.app/learn/window-customization/
# [target."cfg(target_os = \"macos\")".dependencies]
# cocoa = "0.26"


[dev-dependencies]
serial_test = "3.2.0"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = 3 # `s` prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
